<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        :root {
            --pixel-size: 4px;
        }
        body {
            background-color: transparent;
            margin: 0;
            overflow: hidden;
            font-family: 'JetBrains Mono', monospace;
        }

        /* CRT Scanline Effect */
        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 3px 100%;
            z-index: 100;
            pointer-events: none;
            opacity: 0.3;
        }

        /* Stepped Pixel Border - Obsidian Pixel Protocol */
        .pixel-border-4 {
            box-shadow: 
                0 calc(var(--pixel-size) * -1) 0 0 #000,
                0 var(--pixel-size) 0 0 #000,
                calc(var(--pixel-size) * -1) 0 0 0 #000,
                var(--pixel-size) 0 0 0 #000;
        }

        .pixel-border-primary {
            box-shadow: 
                0 calc(var(--pixel-size) * -1) 0 0 #00dbe9,
                0 var(--pixel-size) 0 0 #00dbe9,
                calc(var(--pixel-size) * -1) 0 0 0 #00dbe9,
                var(--pixel-size) 0 0 0 #00dbe9;
        }

        .pixel-border-outline {
            box-shadow: 
                0 -2px 0 0 #44474c,
                0 2px 0 0 #44474c,
                -2px 0 0 0 #44474c,
                2px 0 0 0 #44474c;
        }

        .dither-bg {
            background-image: radial-gradient(#000 1px, transparent 0);
            background-size: 2px 2px;
        }

        .dither-gold {
            color: #ffd700;
            text-shadow: 2px 2px 0px #8b4513;
        }

        /* Animation for Pressing */
        .active-press:active {
            transform: translate(2px, 2px);
        }

        /* Hollow Panel Effect */
        .hollow-panel {
            background-color: rgba(16, 33, 48, 0.85);
            backdrop-filter: blur(2px);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-bright": "#2b3b4b",
                        "outline-variant": "#44474c",
                        "primary-fixed": "#d5e3fc",
                        "surface-container": "#102130",
                        "secondary": "#ffb3ad",
                        "tertiary-fixed": "#7df4ff",
                        "surface-dim": "#041424",
                        "on-surface": "#d3e4fa",
                        "tertiary-container": "#001719",
                        "surface-container-highest": "#263647",
                        "secondary-container": "#c00019",
                        "on-surface-variant": "#c4c6cd",
                        "background": "#041424",
                        "primary": "#b9c7df",
                        "tertiary": "#00dbe9",
                        "on-tertiary": "#00363a",
                        "outline": "#8e9197",
                    },
                    spacing: {
                        "border-width-lg": "4px",
                        "gutter": "12px",
                        "unit": "2px",
                        "margin": "16px",
                    },
                    fontFamily: {
                        "body-md": ["JetBrains Mono"],
                        "label-sm": ["JetBrains Mono"],
                        "headline-md": ["JetBrains Mono"],
                        "display-lg": ["JetBrains Mono"],
                    },
                    fontSize: {
                        "body-md": ["12px", {"lineHeight": "1.4", "fontWeight": "400"}],
                        "label-sm": ["10px", {"lineHeight": "1.0", "fontWeight": "700"}],
                        "headline-md": ["20px", {"lineHeight": "1.1", "fontWeight": "700"}],
                        "display-lg": ["40px", {"lineHeight": "1.0", "letterSpacing": "-2px", "fontWeight": "800"}],
                    }
                }
            }
        }
    </script>
</head>

</header>
<!-- CENTER HUD (Empty Space for Gameplay) -->

<!-- BOTTOM HUD SECTION -->

<!-- Bottom Center: Control Console (COMPACT) -->
<div class="flex flex-col items-center gap-1 max-w-2xl w-full">
<!-- Progress: Seasoned -->
<div class="hollow-panel px-3 py-1 pixel-border-outline flex items-center gap-3">
<span class="font-label-sm text-on-surface-variant uppercase text-[8px]">Exp Status</span>
<div class="w-32 h-1.5 bg-surface-dim pixel-border-outline flex overflow-hidden">
<div class="h-full bg-secondary w-[88%]"></div>
</div>

</div>
<!-- Main Console Box -->

<div class="flex flex-col gap-2">
<!-- Skill Slots (Icons Removed) -->

<!-- Q -->
<div class="w-14 h-10 bg-tertiary-container pixel-border-primary flex flex-col items-center justify-center p-1 relative active-press cursor-pointer">

<!-- XP & Stats Bar -->

<div class="flex-grow h-2 bg-surface-bright pixel-border-outline relative overflow-hidden">
<div class="h-full bg-secondary w-[68%]"></div>

</div>
<div class="flex gap-2 font-label-sm text-[9px]">
<span class="text-tertiary-fixed">22<span class="text-secondary">G</span></span>
<span class="text-[#7df4ff]">65<span class="text-white">◆</span></span>

<!-- Bottom Nav Bar Links -->

<div class="flex gap-2">

<div class="absolute top-[20%] left-[10%] w-1 h-1 bg-white opacity-20 animate-pulse"></div>
<div class="absolute top-[40%] left-[80%] w-1 h-1 bg-white opacity-30 animate-pulse delay-700"></div>
</div>
<script>
        document.addEventListener('keydown', (e) => {
            const keyMap = {'q': 'Q','e': 'E','r': 'R','f': 'F','c': 'C'};
            const key = e.key.toLowerCase();
            if (keyMap[key]) {
                const elements = document.querySelectorAll('span');
                let target = null;
                for(let el of elements) {
                    if(el.innerText === keyMap[key] && el.classList.contains('font-label-sm')) {
                        target = el.parentElement;
                        break;
                    }
                }
                if (target) {
                    const originalBg = target.classList.contains('bg-tertiary-container') ? 'bg-tertiary-container' : 'bg-surface-container-highest';
                    target.classList.remove(originalBg);
                    target.classList.add('bg-tertiary');
                    setTimeout(() => {
                        target.classList.remove('bg-tertiary');
                        target.classList.add(originalBg);
                    }, 100);
                }
            }
        });
    </script>


</body></html>
